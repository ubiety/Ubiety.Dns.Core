# Netlify build for the DocFX documentation site.
#
# The Netlify build image ships Node, Ruby, Python, Go, Java, PHP, Swift and Rust, but not .NET,
# so the build script installs the SDK pinned in global.json before running DocFX.

[build]
  base = ""
  publish = "docs/_site"
  command = "./docs/netlify-build.sh"

[build.environment]
  DOTNET_NOLOGO = "1"
  DOTNET_CLI_TELEMETRY_OPTOUT = "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE = "1"

# Deploy previews and branch deploys build the same way as production.
[context.deploy-preview]
  command = "./docs/netlify-build.sh"

[context.branch-deploy]
  command = "./docs/netlify-build.sh"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# DocFX writes hashed asset filenames, so they are safe to cache hard.
[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
