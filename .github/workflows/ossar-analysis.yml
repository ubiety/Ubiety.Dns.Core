# This workflow integrates a collection of open source static analysis tools
# with GitHub code scanning. For documentation, or to provide feedback, visit
# https://github.com/github/ossar-action
name: OSSAR

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop
  schedule:
    - cron: '0 6 * * 6'

permissions:
  contents: read

jobs:
  ossar-scan:
    name: OSSAR Scan
    # OSSAR only runs on Windows runners.
    runs-on: windows-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The MSDO CLI behind OSSAR is a dotnet tool, so it runs into global.json
      # before it can install itself. The image ships 10.0.301, which the pinned
      # 10.0.302 will not roll back to.
      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run OSSAR
        # The repo publishes no floating v2 tag, so the release is pinned.
        uses: github/ossar-action@v2.0.0
        id: ossar

      - name: Upload OSSAR results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.ossar.outputs.sarifFile }}
